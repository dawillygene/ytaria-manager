name: CI
# Tests and builds only. There is intentionally NO deploy step: production deployment is manual (docs/DEPLOYMENT.md).
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ytaria, POSTGRES_PASSWORD: dev, POSTGRES_DB: ytaria }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ytaria" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Test (fake yt-dlp; no public network needed)
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    needs: frontend
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build web bundle + sync (release-safe config)
        run: VITE_API_BASE_URL=https://ci.example.invalid npm run build:android:release
      - name: Assemble unsigned release APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: app-release-unsigned, path: frontend/android/app/build/outputs/apk/release/*.apk }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          printf 'YTARIA_SECRET_KEY=x\nPOSTGRES_PASSWORD=x\nREDIS_PASSWORD=x\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file /tmp/ci.env config -q
      - name: Build images
        run: |
          docker build -t ytaria-backend ./backend
          docker build -f deploy/web.Dockerfile -t ytaria-web .
