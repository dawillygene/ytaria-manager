# Main Nginx config (replaces the image default). Site config lives in conf.d/ (templates/).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Download tickets travel in the URL path: never write them to the access log.
  map $request_uri $loggable_uri {
    ~^(/api/downloads/)[^?\s]+  "$1[redacted]";
    default                      $request_uri;
  }
  log_format main '$remote_addr [$time_local] "$request_method $loggable_uri" $status $body_bytes_sent rt=$request_time';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  include /etc/nginx/conf.d/*.conf;
}
